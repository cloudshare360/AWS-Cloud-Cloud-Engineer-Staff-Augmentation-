<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#232F3E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#141A24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9900;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E57B00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="devGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9900;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E57B00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="devopsGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#642C8F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A1E6E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="opsGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2ECC71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27AE60;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="preProdGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F90;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E57B00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="postProdGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="techNodeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#68A063;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4C9048;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="techPythonGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3776AB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2C5A86;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="techReactGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#61DAFB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CA9D9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="techAngularGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#DD0031;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A00024;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="techGitlabGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FC5028;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C43F20;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="techAWSGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9900;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E57B00;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="225" fill="url(#bgGradient)"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="#FF9900" stroke-width="3" opacity="0.6"/>
  <circle cx="256" cy="256" r="225" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.3"/>
  <!-- Role Segment: Developer - AWS Lambda -->
  <g transform="translate(256, 88)">
    <circle cx="0" cy="0" r="20" fill="url(#devGradient)"/>
    <text x="0" y="4" font-family="Arial" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">λ</text>
  </g>
  <!-- Role Segment: DevOps - AWS CodePipeline -->
  <g transform="translate(375, 180)">
    <circle cx="0" cy="0" r="20" fill="url(#devopsGradient)"/>
    <path d="M -6 3 L -3 3 L -3 -3 L 3 -3 L 3 3 L 6 3 M -3 0 L 3 0 M 3 -3 L 3 3 M 6 3 L 6 -3" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <!-- Role Segment: Operations - Amazon CloudWatch -->
  <g transform="translate(375, 330)">
    <circle cx="0" cy="0" r="20" fill="url(#opsGradient)"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF" opacity="0.9"/>
    <path d="M -7 0 L 7 0 M 0 -7 L 0 7" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9"/>
  </g>
  <!-- Role Segment: Pre-Production - AWS CodeBuild -->
  <g transform="translate(130, 330)">
    <circle cx="0" cy="0" r="20" fill="url(#preProdGradient)"/>
    <rect x="-5" y="-4" width="10" height="8" fill="#FFFFFF" opacity="0.9"/>
    <rect x="-4" y="4" width="2" height="4" fill="#FFFFFF" opacity="0.9"/>
    <rect x="2" y="4" width="2" height="4" fill="#FFFFFF" opacity="0.9"/>
  </g>
  <!-- Role Segment: Post-Production - AWS Health -->
  <g transform="translate(130, 180)">
    <circle cx="0" cy="0" r="20" fill="url(#postProdGradient)"/>
    <path d="M -4 -4 L 4 -4 L 4 4 L -4 4 Z M -2 -3 L 2 -3 L 2 -1 L -2 -1 Z" fill="#FFFFFF" opacity="0.9"/>
    <path d="M -3 1 L 3 1 M -3 3 L 3 3 M -1 -4 L -1 4 L 1 4 L 1 -4" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.9"/>
  </g>

  <!-- Tech Stack Icons within circle -->
  <!-- AWS -->
  <g transform="translate(256, 145)">
    <circle cx="0" cy="0" r="18" fill="url(#techAWSGradient)" opacity="0.95"/>
    <text x="0" y="6" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AWS</text>
  </g>
  <!-- React -->
  <g transform="translate(340, 200)">
    <circle cx="0" cy="0" r="16" fill="url(#techReactGradient)" opacity="0.95"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
    <ellipse cx="0" cy="0" rx="9" ry="6" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.7"/>
    <circle cx="9" cy="0" r="1.5" fill="#FFFFFF"/>
    <circle cx="-4.5" cy="7.8" r="1.5" fill="#FFFFFF"/>
    <circle cx="-4.5" cy="-7.8" r="1.5" fill="#FFFFFF"/>
  </g>
  <!-- Node.js -->
  <g transform="translate(340, 310)">
    <circle cx="0" cy="0" r="16" fill="url(#techNodeGradient)" opacity="0.95"/>
    <path d="M -6 6 L -6 -6 L 6 -6 L 6 6 Z" fill="#FFFFFF" opacity="0.9"/>
    <path d="M -3 2 L 0 -3 L 3 2" fill="none" stroke="#68A063" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Python -->
  <g transform="translate(256, 365)">
    <circle cx="0" cy="0" r="16" fill="url(#techPythonGradient)" opacity="0.95"/>
    <path d="M -6 3 Q -3 -3 0 0 Q 3 3 6 0" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <path d="M -3 -3 Q 0 0 3 -3 Q 0 0 -3 3" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>
  <!-- Angular -->
  <g transform="translate(172, 310)">
    <circle cx="0" cy="0" r="16" fill="url(#techAngularGradient)" opacity="0.95"/>
    <path d="M -5 4 L 0 -5 L 5 4 L -1 1 L 5 1 Z" fill="#FFFFFF"/>
  </g>
  <!-- GitLab -->
  <g transform="translate(172, 200)">
    <circle cx="0" cy="0" r="16" fill="url(#techGitlabGradient)" opacity="0.95"/>
    <path d="M -4 3 Q 0 -4 4 3 Q 4 5 0 4 Q -4 5 -4 3 Z" fill="#FFFFFF"/>
    <circle cx="-2" cy="0" r="1.2" fill="#FC5028"/>
    <circle cx="2" cy="0" r="1.2" fill="#FC5028"/>
  </g>

  <!-- Central Badge -->
  <g>
    <circle cx="256" cy="256" r="80" fill="#2E3A4A" stroke="url(#accentGradient)" stroke-width="5"/>
    <circle cx="256" cy="256" r="74" fill="none" stroke="#FF9900" stroke-width="2" stroke-dasharray="10,8" opacity="0.6"/>
  </g>
  <!-- AWS Cloud symbol -->
  <g fill="#FF9900">
    <path d="M 256 170 Q 230 165 215 180 Q 200 195 208 215 Q 216 230 240 230 Q 265 230 265 205 Q 265 180 256 170 Z" />
    <path d="M 256 170 Q 282 165 297 180 Q 312 195 Q 320 215 Q 328 230 Q 352 230 Q 352 205 Q 352 180 Q 256 170 Z" />
  </g>
  <text x="256" y="256" font-family="Arial" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AWS Cloud Agentic</text>
  <text x="256" y="276" font-family="Arial" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Development</text>
  <text x="256" y="296" font-family="Arial" font-size="15" font-weight="bold" fill="#FF9900" text-anchor="middle">Engineering</text>
  <g fill="#FF9900" opacity="0.8">
    <circle cx="170" cy="340" r="5"/>
    <circle cx="342" cy="340" r="5"/>
    <circle cx="170" cy="170" r="4"/>
    <circle cx="342" cy="170" r="4"/>
  </g>
  <circle cx="256" cy="256" r="155" fill="none" stroke="#FF9900" stroke-width="2" opacity="0.25"/>
</svg>