<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#232F3E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#141A24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9900;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E57B00;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="devGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007ACC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#005A9E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="devopsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#642C8F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A1E6E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="opsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F90;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E57B00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="preProdGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ECC71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27AE60;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="postProdGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="techNodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#68A063;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4C9048;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="techPythonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3776AB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2C5A86;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="techReactGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#61DAFB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CA9D9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="techAngularGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DD0031;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A00024;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="techGitlabGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FC5028;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C43F20;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="techAWSGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9900;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E57B00;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer Circular Boundary -->
  <circle cx="256" cy="256" r="225" fill="url(#bgGradient)"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="#FF9900" stroke-width="3" opacity="0.6"/>
  <circle cx="256" cy="256" r="225" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.3"/>
  <!-- Role Segments within circle -->
  <!-- Segment 1: Developer (Blue) - Top -->
  <g transform="translate(256, 88)">
    <circle cx="0" cy="0" r="14" fill="url(#devGradient)"/>
    <text x="22" y="6" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Developer</text>
  </g>
  <!-- Segment 2: DevOps (Purple) - Top Right -->
  <g transform="translate(375, 180)">
    <circle cx="0" cy="0" r="14" fill="url(#devopsGradient)"/>
    <text x="22" y="6" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">DevOps</text>
  </g>
  <!-- Segment 3: Operations (Orange) - Bottom Right -->
  <g transform="translate(375, 330)">
    <circle cx="0" cy="0" r="14" fill="url(#opsGradient)"/>
    <text x="22" y="6" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Operations</text>
  </g>
  <!-- Segment 4: Pre-Prod Support (Green) - Bottom Left -->
  <g transform="translate(130, 330)">
    <circle cx="0" cy="0" r="14" fill="url(#preProdGradient)"/>
    <text x="22" y="6" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Pre-Prod</text>
  </g>
  <!-- Segment 5: Post-Prod Support (Red) - Top Left -->
  <g transform="translate(130, 180)">
    <circle cx="0" cy="0" r="14" fill="url(#postProdGradient)"/>
    <text x="22" y="6" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Post-Prod</text>
  </g>
  <!-- Tech Stack Icons within circle -->
  <!-- AWS -->
  <g transform="translate(256, 145)">
    <circle cx="0" cy="0" r="18" fill="url(#techAWSGradient)" opacity="0.95"/>
    <text x="0" y="6" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AWS</text>
  </g>
  <!-- React -->
  <g transform="translate(340, 200)">
    <circle cx="0" cy="0" r="16" fill="url(#techReactGradient)" opacity="0.95"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">R</text>
  </g>
  <!-- Node.js -->
  <g transform="translate(340, 310)">
    <circle cx="0" cy="0" r="16" fill="url(#techNodeGradient)" opacity="0.95"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">N</text>
  </g>
  <!-- Python -->
  <g transform="translate(256, 365)">
    <circle cx="0" cy="0" r="16" fill="url(#techPythonGradient)" opacity="0.95"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">P</text>
  </g>
  <!-- Angular -->
  <g transform="translate(172, 310)">
    <circle cx="0" cy="0" r="16" fill="url(#techAngularGradient)" opacity="0.95"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">A</text>
  </g>
  <!-- GitLab -->
  <g transform="translate(172, 200)">
    <circle cx="0" cy="0" r="16" fill="url(#techGitlabGradient)" opacity="0.95"/>
    <text x="0" y="6" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GL</text>
  </g>
  <!-- Central Badge -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="256" r="95" fill="#2E3A4A" stroke="url(#accentGradient)" stroke-width="5"/>
    <circle cx="256" cy="256" r="88" fill="none" stroke="#FF9900" stroke-width="2" stroke-dasharray="10,8" opacity="0.6"/>
  </g>
  <!-- AWS Cloud symbol -->
  <g fill="#FF9900">
    <path d="M 256 180 Q 230 175 215 190 Q 200 205 208 225 Q 216 240 240 240 Q 265 240 265 215 Q 265 190 256 180 Z" />
    <path d="M 256 180 Q 282 175 297 190 Q 312 205 Q 320 225 Q 328 240 Q 352 240 Q 352 215 Q 352 190 Q 256 180 Z" />
  </g>
  <text x="256" y="250" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">AWS</text>
  <text x="256" y="285" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FF9900" text-anchor="middle">Cloud Engineer</text>
  <g fill="#FF9900" opacity="0.8">
    <circle cx="170" cy="340" r="5"/>
    <circle cx="342" cy="340" r="5"/>
    <circle cx="170" cy="170" r="4"/>
    <circle cx="342" cy="170" r="4"/>
  </g>
  <circle cx="256" cy="256" r="155" fill="none" stroke="#FF9900" stroke-width="2" opacity="0.25"/>
</svg>