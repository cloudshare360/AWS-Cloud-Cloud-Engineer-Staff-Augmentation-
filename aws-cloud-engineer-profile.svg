<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#232F3E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#141A24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9900;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E57B00;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="devGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007ACC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#005A9E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="devopsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#642C8F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A1E6E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="opsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F90;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E57B00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="preProdGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ECC71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27AE60;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="postProdGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bgGradient)" rx="64"/>
  <g fill="#3A4A5F" opacity="0.15">
    <circle cx="120" cy="140" r="40"/>
    <circle cx="390" cy="380" r="50"/>
    <circle cx="420" cy="120" r="30"/>
  </g>
  <!-- Role Segment 1: Developer (Blue) -->
  <path d="M 256 256 L 256 105 A 152 152 0 0 1 328 130 Z" fill="url(#devGradient)" opacity="0.9"/>
  <g transform="translate(292, 118) rotate(-36)">
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Developer</text>
    <text x="0" y="24" font-family="Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">&lt;/&gt;</text>
  </g>
  <!-- Role Segment 2: DevOps (Purple) -->
  <path d="M 256 256 L 328 130 A 152 152 0 0 1 407 203 Z" fill="url(#devopsGradient)" opacity="0.9"/>
  <g transform="translate(370, 170) rotate(18)">
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">DevOps</text>
    <text x="0" y="24" font-family="Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">🔄</text>
  </g>
  <!-- Role Segment 3: Operations (Orange) -->
  <path d="M 256 256 L 407 203 A 152 152 0 0 1 435 295 Z" fill="url(#opsGradient)" opacity="0.9"/>
  <g transform="translate(422, 250) rotate(72)">
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Operations</text>
    <text x="0" y="24" font-family="Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">⚙️</text>
  </g>
  <!-- Role Segment 4: Pre-Production Support (Green) -->
  <path d="M 256 256 L 435 295 A 152 152 0 0 1 328 382 Z" fill="url(#preProdGradient)" opacity="0.9"/>
  <g transform="translate(370, 330) rotate(126)">
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Pre-Prod</text>
    <text x="0" y="24" font-family="Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">🧪</text>
  </g>
  <!-- Role Segment 5: Post-Production Support (Red) -->
  <path d="M 256 256 L 328 382 A 152 152 0 0 1 184 382 Z" fill="url(#postProdGradient)" opacity="0.9"/>
  <g transform="translate(256, 370) rotate(180)">
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Post-Prod</text>
    <text x="0" y="24" font-family="Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">🛠️</text>
  </g>
  <!-- Central Badge -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="256" r="130" fill="#2E3A4A" stroke="url(#accentGradient)" stroke-width="5"/>
    <circle cx="256" cy="256" r="118" fill="none" stroke="#FF9900" stroke-width="2" stroke-dasharray="10,8" opacity="0.6"/>
  </g>
  <!-- AWS Cloud symbol -->
  <g fill="#FF9900">
    <path d="M 256 150 Q 220 140 200 160 Q 180 180 190 210 Q 200 230 230 230 Q 260 230 260 200 Q 260 170 256 150 Z" />
    <path d="M 256 150 Q 292 140 312 160 Q 332 180 322 210 Q 312 230 282 230 Q 252 230 252 200 Q 252 170 256 150 Z" />
  </g>
  <text x="256" y="250" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">AWS</text>
  <text x="256" y="295" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FF9900" text-anchor="middle">Cloud Engineer</text>
  <g fill="#FF9900" opacity="0.8">
    <circle cx="170" cy="340" r="6"/>
    <circle cx="342" cy="340" r="6"/>
    <circle cx="170" cy="170" r="4"/>
    <circle cx="342" cy="170" r="4"/>
  </g>
  <circle cx="256" cy="256" r="155" fill="none" stroke="#FF9900" stroke-width="2" opacity="0.25"/>
</svg>